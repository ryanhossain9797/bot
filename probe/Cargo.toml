[package]
name = "probe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", features = ["json"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
